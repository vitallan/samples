version: "3.9"

services:
  mariadb:
    image: mariadb:11
    container_name: mariadboas
    restart: unless-stopped
    cpus: "0.5"
    environment:
      MARIADB_ROOT_PASSWORD: passwd_root
      MARIADB_DATABASE: shortener_db
      MARIADB_USER: shortener_usr
      MARIADB_PASSWORD: shortner_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command:
      - --flush=ON

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmqqisso
    restart: unless-stopped
    cpus: "0.5"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_usr
      RABBITMQ_DEFAULT_PASS: rabbit_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mariadb_data:
  rabbitmq_data:
